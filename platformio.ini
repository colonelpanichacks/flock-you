; ── Atom Voice (C008-C, ESP32-PICO-D4, SK6812 LED + NS4168 I²S speaker) ──────
; Same ESP32 PICO as Atom Lite/Echo; FTDI USB; speaker is I²S not PWM buzzer.
; Speaker pins (per schematic): DATA=G22, BCLK=G19, LRCK=G33
[env:m5atom-voice]
platform = espressif32@^6.3.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
upload_port = /dev/tty.usbserial-*

lib_deps =
    adafruit/Adafruit NeoPixel@^1.15.1
    m5stack/M5Unified @ ^0.2.2

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DUSE_M5ATOM_VOICE

build_src_filter = +<main.cpp>

board_build.partitions = partitions_4mb.csv
board_build.filesystem = spiffs

