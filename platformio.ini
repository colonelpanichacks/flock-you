[platformio]
src_dir = .

; ── Standard ESP32 DevKit ─────────────────────────────────────────────────────
[env:esp32dev]
platform = espressif32@^6.3.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0

build_src_filter = +<main.cpp>

board_build.partitions = partitions_4mb.csv
board_build.filesystem = spiffs

; ── Native unit-test environment (no hardware needed) ────────────────────────
; Compiles fy_detect.h logic against the host GCC/Clang and runs Unity tests.
;   pio test -e native                          # run all test suites
;   pio test -e native -f test_ble_matching     # MAC / BLE name / mfr ID
;   pio test -e native -f test_uuid_matching    # Raven UUID / FW version
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++11
    -D_GNU_SOURCE
build_src_filter = -<*>

; ── Standard ESP32 DevKit + BLE coexistence ──────────────────────────────────
; BLE_COEX_MODE=1: ESP-IDF SW coexistence scheduler runs WiFi promiscuous and
; BLE passive scan simultaneously.  No manual pause/resume needed.
; The firmware starts a continuous NimBLE scan immediately after WiFi init.
; Trade-off: ~10-20% of WiFi frames missed during BLE TX/RX windows vs the
; old 5s-every-60s blackout (8% loss but 5 full blind seconds each time).
; Set -DBLE_COEX_MODE=0 to revert to the original time-multiplexing strategy.
[env:esp32dev-ble]
platform = espressif32@^6.3.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DENABLE_BLE_SCAN=1
    -DBLE_COEX_MODE=1

build_src_filter = +<main.cpp>

board_build.partitions = partitions_4mb.csv
board_build.filesystem = spiffs

; ── M5Atom Echo (ESP32-PICO-D4, buzzer GPIO25 only) ──────────────────────────
[env:m5atom-echo]
