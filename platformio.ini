[platformio]
src_dir = .
boards_dir = boards
default_envs = xiao_esp32s3


[env:xiao_esp32s3]
platform = espressif32@^6.3.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

build_src_filter =
    +<main.cpp>

board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = spiffs


[env:lilygo_t_dongle_s3]
platform = espressif32@6.12.0
board = dongles3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_LILYGO_T_DONGLE_S3
    -DUSE_T_DONGLE_DISPLAY
    -DUSE_FSPI_PORT

    -DUSER_SETUP_LOADED
    -DST7735_DRIVER
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DST7735_GREENTAB160x80
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_MISO=-1
    -DTFT_MOSI=3
    -DTFT_SCLK=5
    -DTFT_CS=4
    -DTFT_DC=2
    -DTFT_RST=1
    -DLOAD_GLCD
    -DSPI_FREQUENCY=27000000

build_src_filter =
    +<main.cpp>
    +<display_dongle.cpp>