; ── Atom VoiceS3R (ESP32-S3-PICO-1-N8R8, 8MB flash, 8MB PSRAM) ──────────────
; USB CDC port: /dev/tty.usbmodem*  (not usbserial — it's native USB)
; Speaker: ES8311 codec via I2S — driven through M5Unified M5.Speaker.tone()
; Normal mode: Flock OUI detection only. Add -DTESTING_MODE=1 to alert on all WiFi.
[env:m5atom-voices3r]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/tty.usbmodem*

board_build.arduino.memory_type = qio_opi

lib_deps =
    m5stack/M5Unified @ ^0.2.2

build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DUSE_M5ATOM_VOICES3R

build_src_filter = +<main.cpp>

board_build.partitions = partitions_4mb.csv
board_build.filesystem = spiffs

; ── Atom VoiceS3R + BLE coexistence ──────────────────────────────────────────
; BLE_COEX_MODE=1: continuous NimBLE passive scan, no promiscuous pause.
; ESP32-S3 SW coexistence is identical to ESP32 — same coex module.
[env:m5atom-voices3r-ble]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/tty.usbmodem*

board_build.arduino.memory_type = qio_opi

lib_deps =
    m5stack/M5Unified @ ^0.2.2
    h2zero/NimBLE-Arduino@^1.4.3

build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DUSE_M5ATOM_VOICES3R
    -DENABLE_BLE_SCAN=1
    -DBLE_COEX_MODE=1

build_src_filter = +<main.cpp>

board_build.partitions = partitions_4mb.csv
board_build.filesystem = spiffs

; ── LILYGO T-Dongle C5 (ESP32-C5, dual-band WiFi 6, BT5, 16MB flash) ─────────
; USB-C dongle · GPIO8 onboard indicator LED (active-high, plain GPIO)
; ESP32C5_DUALBAND=1 enables 5 GHz ch.149/157 promiscuous scan.
[env:lilygo-t-dongle-c5]
