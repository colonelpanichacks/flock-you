[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.psram_type = opi
lib_deps = 
    h2zero/NimBLE-Arduino@^1.4.0
    bblanchon/ArduinoJson@^6.21.0
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_ENABLED=1

[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_build.psram_type = opi
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0
    bblanchon/ArduinoJson@^6.21.0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_ENABLED=1

; ============================================================================
; T-BEAM SUPREME S3 - LoRa Mesh Detection System
; ============================================================================
; LILYGO T-Beam Supreme with ESP32-S3 + SX1262 LoRa + GNSS
; Transmits detections over LoRa instead of Serial/WebUI
; ============================================================================

[env:tbeam_supreme]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi

; Use separate source file for T-Beam variant
build_src_filter = +<*> -<main.cpp> +<main_tbeam.cpp>

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0
    bblanchon/ArduinoJson@^6.21.0
    jgromes/RadioLib@^6.6.0
    mikalhart/TinyGPSPlus@^1.0.3

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DTBEAM_SUPREME=1
    -DLORA_FREQUENCY=915.0
    ; For EU, use: -DLORA_FREQUENCY=868.0

; T-Beam Supreme 868MHz variant (EU)
[env:tbeam_supreme_eu]
extends = env:tbeam_supreme
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DTBEAM_SUPREME=1
    -DLORA_FREQUENCY=868.0

; ============================================================================
; T-BEAM SUPREME RECEIVER - Receives detection broadcasts
; ============================================================================
; Use this on a second T-Beam to receive and display detections
; ============================================================================

[env:tbeam_supreme_receiver]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi

; Use receiver source file
build_src_filter = +<*> -<main.cpp> -<main_tbeam.cpp> +<receiver_tbeam.cpp>

lib_deps =
    jgromes/RadioLib@^6.6.0
    olikraus/U8g2@^2.35.9

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DTBEAM_SUPREME=1
    -DLORA_FREQUENCY=915.0
