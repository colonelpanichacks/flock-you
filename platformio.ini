[platformio]
src_dir = .

[env:xiao_esp32s3]
platform = espressif32@^6.3.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

build_src_filter = +<main.cpp>

board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = spiffs

[env:m5stack-cardputer]
; No dedicated "m5stack-cardputer" board JSON in this espressif32 platform
; version, so we borrow m5stack-stamps3 (same ESP32-S3 chip, same 8MB flash
; layout as partitions.csv below) and let M5Unified/M5Cardputer own the
; board-specific display/keyboard/speaker bring-up at runtime.
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1 # Use setTxTimeoutMs() from HWCDC/USBCDC
    -DBOARD_M5STACK_CARDPUTER

lib_deps =
	m5stack/M5Cardputer@^1.1.1
	m5stack/M5Unified@^0.2.10

build_src_filter = +<main.cpp> +<display_cardputer.cpp>

board_build.partitions = partitions.csv
board_build.filesystem = spiffs
